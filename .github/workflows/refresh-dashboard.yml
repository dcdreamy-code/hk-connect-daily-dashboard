name: Refresh dashboard data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"
    - cron: "45 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Refresh market data
        run: npm run refresh
      - name: Validate snapshot
        run: npm run validate
      - name: Generate share image
        run: npm run image
      - name: Commit changed snapshots
        id: commit
        run: |
          if git diff --quiet -- public/data public/images; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json public/data/daily public/data/ah-pairs.json public/images
          git commit -m "data: refresh Hong Kong Connect rankings"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare (Workers + Pages)
        if: env.HAS_CF_TOKEN == 'true' && steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1df702bc8b55f895a9f70e10542cdded
        run: |
          npx wrangler@4.131.1 deploy -c wrangler.worker.toml
          npx wrangler@4.131.1 pages deploy

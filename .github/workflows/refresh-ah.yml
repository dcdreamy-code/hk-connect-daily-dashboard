name: Refresh AH mapping

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 1 * *"

permissions:
  contents: write

jobs:
  refresh-ah:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run refresh:ah
      - name: Commit mapping changes
        run: |
          if git diff --quiet -- public/data/ah-pairs.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ah-pairs.json
          git commit -m "data: refresh AH mapping"
          git push
